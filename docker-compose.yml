services:
  db:
    image: postgis/postgis:17-3.5
    container_name: axiz-geo-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: axiz_geo
      POSTGRES_USER: axiz_user
      POSTGRES_PASSWORD: axiz_dev_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - axiz_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiz_user -d axiz_geo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  axiz_pgdata:
